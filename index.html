<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Pengeluaran Harian</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            color: #306d29;
        }

        .total {
            background: #eaf4e8;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        button {
            background: #306d29;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Catatan Pengeluaran</h1>
        <p>Kelola pengeluaran harianmu dengan mudah.</p>

        <div class="total">
            <p>Total Pengeluaran</p>
            <h2 id="total">Rp 0</h2>
        </div>

        <h3>Tambah Pengeluaran</h3>

        <form id="expenseForm">
            <label>Nama Pengeluaran</label>
            <input id="name" type="text" placeholder="Contoh: Makan siang" required>

            <label>Kategori</label>
            <select id="category">
                <option>Makanan</option>
                <option>Transportasi</option>
                <option>Kuliah</option>
                <option>Kebutuhan</option>
                <option>Lainnya</option>
            </select>

            <label>Nominal (Rp)</label>
            <input id="amount" type="number" min="1" placeholder="Contoh: 15000" required>

            <button type="submit">Tambah Pengeluaran</button>
        </form>

        <h3>Riwayat Pengeluaran</h3>
        <div id="list"></div>
    </div>

    <script>
        const form = document.getElementById('expenseForm');
        const list = document.getElementById('list');
        const totalElement = document.getElementById('total');

        let expenses = [];

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const category = document.getElementById('category').value;
            const amount = Number(document.getElementById('amount').value);

            if (!name || !Number.isFinite(amount) || amount <= 0) {
                alert('Masukkan nama dan nominal yang valid.');
                return;
            }

            expenses.push({ name, category, amount });
            renderExpenses();
            form.reset();
        });

        function renderExpenses() {
            list.replaceChildren();

            const total = expenses.reduce((sum, item) => sum + item.amount, 0);
            totalElement.textContent = 'Rp ' + total.toLocaleString('id-ID');

            expenses.forEach(function(item) {
                const row = document.createElement('div');
                row.className = 'item';

                const title = document.createElement('strong');
                title.textContent = item.name;

                const details = document.createElement('p');
                details.textContent = item.category + ' — Rp ' +
                    item.amount.toLocaleString('id-ID');

                row.append(title, details);
                list.appendChild(row);
            });
        }
    </script>
</body>
</html>
